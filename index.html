<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>small template design</title>
    <style>
        body {
            background-color: rgb(196, 151, 224);
            padding:0px;
            margin: 15px;
            display: flex;


        }

        .card {
            width: 194px;
            height: 344px;
            background-color: rgb(249, 178, 242);
            border-radius: 13px;
            margin: 15px;
        }

        .image {
            padding: 5px;
            border-radius: 12px;
        }

        .image img {
            width: 180px;
            padding: 0px 2px;
            border-radius: 15px;
        }

        .capsules {
            padding: 0px 30px;
        }

        .capsules span {
            border: 2px solid;
            padding: 1px 5px 5px 9px;
            margin: 0px;
            border-radius: 15px;
            border-color: rgb(220, 150, 193);
        }
        .button{
            text-align: center;
        }
        .button button{
            background-color: rgb(187, 128, 224);
            padding: 3px 9px 4px 12px ;
            font-weight: bold;
            color: rgb(21, 5, 35);
            border: none;
            border-radius: 15px;
        }
        .button button:hover{
            background-color: rgb(218, 127, 202);
            color: black;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img
                src="nature.webp" />
        </div>
        <div class="capsules">
            <span>nature</span>
            <span>blossom</span>
